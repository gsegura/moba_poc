[project]
name = "moba_poc"
version = "0.1.0"
description = "Deep Research POC using MoBA and KV Cache"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "torch>=2.1.0",
    "requests>=2.31.0",
    "html2text>=2020.1.16",
    "google-api-python-client>=2.0.0",
    "flash-attn>=2.6.3",
    "einops>=0.8.1",
    "accelerate>=1.3.0",
    "transformers>=4.48.3",
    "markitdown>=0.0.1a4",
    "ollama>=0.4.7",
    "openai>=1.63.2",
]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["moba_research*"]
exclude = ["tests*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "ruff>=0.1.0",
]
